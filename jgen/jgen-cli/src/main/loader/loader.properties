# Read by Spring Boot's PropertiesLauncher (the jar uses the ZIP layout).
# Blueprint jars dropped into ~/.jgen/blueprints are added to the classpath, so new blueprints need no rebuild.
# The bin/jgen launcher overrides this to also include $JGEN_HOME/blueprints and $JGEN_BLUEPRINTS.
loader.path=${user.home}/.jgen/blueprints
