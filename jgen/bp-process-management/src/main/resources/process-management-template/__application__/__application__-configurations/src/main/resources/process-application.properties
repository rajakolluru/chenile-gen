server.address=${PROCESS_ADMIN_BIND_ADDRESS:127.0.0.1}
server.port=${PROCESS_ADMIN_PORT:8080}
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.sql.init.mode=never
spring.h2.console.enabled=false
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
spring.datasource.url=${PROCESS_DATABASE_URL:}
spring.datasource.username=${PROCESS_DATABASE_USERNAME:}
spring.datasource.password=${PROCESS_DATABASE_PASSWORD:}
spring.datasource.hikari.auto-commit=false
chenile.process.management.enabled=true
chenile.process.management.api-key=${PROCESS_MANAGEMENT_API_KEY:}
chenile.process.management.protect-all-http-routes=true
chenile.process.outbox.enabled=true
chenile.external-api.logging.enabled=false
