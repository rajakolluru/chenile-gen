# Publishes JGen when a version tag is pushed (e.g. `git push origin 2.5.1`), or on demand.
# JGen is versioned independently of Chenile (2.5.x) and builds only against released Chenile versions.
# jgen-base and jgen-ext-pebble go to Maven Central separately: `make -C jgen deploy-central version=<v> ...`.
# The release in this repository uses the workflow's own GITHUB_TOKEN. Updating the Homebrew formula needs a
# repository secret JRELEASER_HOMEBREW_GITHUB_TOKEN: a fine-grained personal access token whose resource owner is
# ajapros, limited to ajapros/homebrew-jgen-tap, with "Contents: Read and write".
name: Release JGen

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (an existing tag, e.g. 2.5.1)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ github.event.inputs.version || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.VERSION }}
          fetch-depth: 0

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build JGen
        # The tag is the JGen version. Chenile comes from the released chenile-parent in jgen/pom.xml.
        run: mvn -B -ntp -f jgen/pom.xml install -DskipTests -Drevision=${VERSION}

      - name: Check the distribution
        run: |
          test -f "jgen/jgen-cli/target/jgen-cli-${VERSION}-dist.zip"
          cp "jgen/jgen-cli/target/jgen-cli-${VERSION}.jar" jgen/jgen-cli/target/jgen-cli.jar
          unzip -q "jgen/jgen-cli/target/jgen-cli-${VERSION}-dist.zip" -d /tmp/jgen-dist
          "/tmp/jgen-dist/jgen-${VERSION}/bin/jgen" --version

      - name: Release
        uses: jreleaser/release-action@v2
        with:
          arguments: full-release
        env:
          JRELEASER_PROJECT_VERSION: ${{ env.VERSION }}
          JRELEASER_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JRELEASER_HOMEBREW_GITHUB_TOKEN: ${{ secrets.JRELEASER_HOMEBREW_GITHUB_TOKEN }}

      - name: Keep JReleaser output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jreleaser-output
          path: out/jreleaser
